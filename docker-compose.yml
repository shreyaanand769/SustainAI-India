services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports: ["8000:8000"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: sustainai
      POSTGRES_USER: sustainai
      POSTGRES_DB: sustainai
    ports: ["5432:5432"]
