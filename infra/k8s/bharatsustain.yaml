apiVersion: apps/v1
kind: Deployment
metadata:
  name: bharatsustain-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: bharatsustain-api }
  template:
    metadata:
      labels: { app: bharatsustain-api }
    spec:
      containers:
        - name: api
          image: bharatsustain/api:1.0.0
          ports: [{ containerPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bharatsustain-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: bharatsustain-web }
  template:
    metadata:
      labels: { app: bharatsustain-web }
    spec:
      containers:
        - name: web
          image: bharatsustain/web:1.0.0
          ports: [{ containerPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: bharatsustain-api
spec:
  selector: { app: bharatsustain-api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: bharatsustain-web
spec:
  type: LoadBalancer
  selector: { app: bharatsustain-web }
  ports: [{ port: 80, targetPort: 3000 }]
